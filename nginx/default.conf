server {
  listen 80;
  client_max_body_size 20M;

  location / {
    proxy_pass http://frontend:80;
    proxy_set_header Host $host;
  }

  location /api/ {
    proxy_pass http://backend:4000/api/;
    proxy_set_header Host $host;
  }

  location /uploads/ {
    proxy_pass http://backend:4000/uploads/;
  }
}
